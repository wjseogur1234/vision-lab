# split_locations.py가 만든 안이다. 검토 후 고정한다.
source_manifest: data/interim/raw-manifests/101/manifest.csv
unit: location
ratios:
  train: 0.7
  val: 0.15
  test: 0.15
seed: 0
splits:
  train:
  - LG전자 부천랜드점 부근
  - 갑천교네거리
  - 계룡대교네거리
  - 국민은행 심곡점 앞
  - 김가네 상동점 앞 (홈플러스 진입로 앞)
  - 넘말사거리
  - 멀뫼사거리
  - 범계사거리
  - 범계역사거리
  - 보강센트럴빌 2차 앞
  - 부천IC 자동차매매단지 앞
  - 부천남부역 공영주차장
  - 사단사거리
  - 소방서사거리
  - 소사역앞
  - 소사회주로삼거리
  - 소신여객 앞
  - 신한은행 중동점 부근
  - 아이쇼핑 앞
  - 역곡남부역사거리
  - 연구단지네거리
  - 오정물류단지(하행)
  - 용반네거리
  - 웨스턴파크 (부천역전우체국 건너편)
  - 유성네거리
  - 중동사거리
  - 진터지하차도
  val:
  - 디아뜨갤러리 앞 (포도마을 맞은편)
  - 범박터널-범박1교방향
  - 원골네거리
  - 충대오거리
  test:
  - 과학공원네거리
  - 삼정고가교
  - 원종 철골공영주차장 (마사회)
  - 중동IC하부(판교진출)
  - 충대서문네거리
  - 현대블루핸즈 소사점 부근
